name: Sync public README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync token
        env:
          README_SYNC_TOKEN: ${{ secrets.README_SYNC_TOKEN }}
        run: |
          if [ -z "$README_SYNC_TOKEN" ]; then
            echo "::error::Configure the README_SYNC_TOKEN repository secret before syncing."
            exit 1
          fi
      - name: Check out BlueTL
        uses: actions/checkout@v4
      - name: Check out public README repository
        uses: actions/checkout@v4
        with:
          repository: BorneanWingz/PrivateRepoReadmes
          ref: main
          token: ${{ secrets.README_SYNC_TOKEN }}
          path: public-readmes
      - name: Publish README
        run: |
          cp README.md public-readmes/BlueTLReadme.md
          cd public-readmes
          git add BlueTLReadme.md
          if git diff --cached --quiet; then
            echo "Public README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync BlueTL README" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
